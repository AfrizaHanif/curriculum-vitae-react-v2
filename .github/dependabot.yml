version: 2
updates:
  # Pembaruan dependensi Node.js / npm (Next.js, React, Bootstrap, dll.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # TypeScript 7 belum didukung oleh typescript-eslint / eslint-config-next
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Mengelompokkan semua pembaruan npm ke dalam 1 PR gabungan untuk mencegah spam PR
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Pembaruan dependensi GitHub Actions (actions/checkout, setup-node, dll.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    # Mengelompokkan semua pembaruan GitHub Actions ke dalam 1 PR gabungan
    groups:
      github-actions:
        patterns:
          - "*"
