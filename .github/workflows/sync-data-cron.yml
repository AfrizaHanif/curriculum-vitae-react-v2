name: 🔄 Scheduled API Data Sync & Auto-Deploy

on:
  schedule:
    # Berjalan setiap hari pukul 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Picu deployment meskipun tidak ada perubahan data"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-data-cron
  cancel-in-progress: true

jobs:
  sync_and_deploy:
    name: 🔄 Sync Profile Data from API
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "2. Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "3. Install dependencies"
        run: npm ci

      - name: "4. Synchronize Latest Data from API"
        run: npm run sync-data
        env:
          API_BASE_URL: "https://api.afrizahanif.com/api"
          FAIL_ON_SYNC_ERROR: true
          API_SECRET_TOKEN: ${{ secrets.API_SECRET_TOKEN || '' }}

      - name: "5. Check for Data Changes"
        id: git_diff
        run: |
          if git diff --quiet src/data/jsons/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Tidak ada perubahan data pada berkas JSON dari API."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✨ Ditemukan perubahan data baru dari API!"
          fi

      - name: "6. Commit & Push Updated Data"
        if: steps.git_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/jsons/
          git commit -m "chore(data): auto-sync latest API datasets [skip ci]"
          git push origin ${{ github.ref_name }}
          echo "✅ Seluruh perubahan data JSON berhasil di-commit dan di-push ke branch ${{ github.ref_name }}."

      - name: "7. Trigger Deployment Workflow"
        if: steps.git_diff.outputs.has_changes == 'true' || inputs.force_deploy == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Menjalankan alur deployment untuk mempublikasikan data terbaru..."
          gh workflow run deploy.yml --ref ${{ github.ref_name }} || echo "⚠️ Tidak dapat memicu via gh CLI, pastikan Actions permission 'Read and write' aktif."

      - name: "8. Generate Summary"
        if: always()
        run: |
          HAS_CHANGES="${{ steps.git_diff.outputs.has_changes }}"
          FORCE_DEPLOY="${{ inputs.force_deploy || 'false' }}"

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🔄 API Data Sync Summary

          | Parameter | Hasil | Keterangan |
          |---|:---:|---|
          | **Status Sinkronisasi** | ✅ SUKSES | Berhasil sinkronisasi seluruh dataset dari \`api.afrizahanif.com\` |
          | **Perubahan Data** | $([ "$HAS_CHANGES" = "true" ] && echo "✨ ADA PEMBARUAN" || echo "☕ TIDAK ADA PERUBAHAN") | Status berkas di folder \`src/data/jsons/\` |
          | **Pemicu Deploy** | $([ "$HAS_CHANGES" = "true" ] || [ "$FORCE_DEPLOY" = "true" ] && echo "🚀 DIPICU" || echo "⏭️ DILEWATI") | Otomatis deploy jika ada data baru |
          | **Target Folder** | 📂 \`src/data/jsons/\` (18 datasets) | Berkas penyimpanan data lokal |
          EOF
